name: Commissary - Build and Push Image

# Commissary's own image publish. Upstream's docker-publish.yml, dev-nightly.yml
# and cleanup-dev-images.yml are kept unmodified (so upstream merges never
# conflict on them) and skip here: they are guarded to Nezreka/SoulSync.
#
# Publishes to GitHub Container Registry with the built-in GITHUB_TOKEN.
#
# ONE-TIME SETUP after the first successful run: the package is created PRIVATE
# and `docker pull` will fail for everyone until it is made public. Flip it at
# github.com/users/ThyMrMan/packages/container/commissary/settings ->
# "Change visibility" -> Public. GITHUB_TOKEN cannot do this.

on:
  # MANUAL ONLY: publishing an image is a release decision, not a side effect
  # of a push. Run it from Actions -> "Commissary - Build and Push Image".
  workflow_dispatch:
    inputs:
      version_tag:
        description: >-
          Version tag. Leave empty to use _SOULSYNC_BASE_VERSION from
          web_server.py (e.g. 3.5.7-c.1). Also published as :latest.
        required: false
        default: ''

jobs:
  build-and-push:
    if: github.repository == 'ThyMrMan/commissary'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # GHCR rejects uppercase path segments, and the owner here is "ThyMrMan".
      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # The app's own version string is the single source of truth, so the tag
      # can't drift from what the running app reports.
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version_tag }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version=$(sed -n 's/^_SOULSYNC_BASE_VERSION = "\(.*\)"$/\1/p' web_server.py)
          fi
          if [ -z "$version" ]; then
            echo "Could not determine the version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Publishing version $version"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # org.opencontainers.image.source links the GHCR package back to this repo.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/${{ env.OWNER }}/commissary
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
