name: Build and Push Docker Image

on:
  # MANUAL ONLY. There is deliberately no `push:` trigger — publishing to Docker
  # Hub is a release decision, not something every commit to main should do.
  # Run it from Actions → "Build and Push Docker Image" → Run workflow.
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. 1.6.12). Also published as :latest.'
        required: true
        default: '1.6.12'

jobs:
  build-and-push:
    if: github.repository == 'ThyMrMan/soul-sync-thymrman-customized'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            thymrman/soul-sync-custom:latest
            ${{ inputs.version_tag != '' && format('thymrman/soul-sync-custom:{0}', inputs.version_tag) || '' }}
