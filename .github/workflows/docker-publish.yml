name: Build and Push Docker Image

# Publishes to GitHub Container Registry (GHCR), not Docker Hub. Auth is the
# built-in GITHUB_TOKEN via the `packages: write` permission below — there are
# no DOCKERHUB_* secrets to keep alive.
#
# ONE-TIME SETUP after the first successful run: the package is created PRIVATE
# and `docker pull` will fail for everyone until it is made public. Flip it at
# github.com/users/ThyMrMan/packages/container/commissary/settings →
# "Change visibility" → Public. GITHUB_TOKEN cannot do this, so no workflow step
# can automate it.

on:
  # MANUAL ONLY. There is deliberately no `push:` trigger — publishing an image
  # is a release decision, not something every commit to main should do.
  # Run it from Actions → "Build and Push Docker Image" → Run workflow.
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. 2.1.0). Also published as :latest.'
        required: true
        default: '2.1.0'

jobs:
  build-and-push:
    if: github.repository == 'ThyMrMan/commissary'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # GHCR rejects uppercase path segments, and the owner here is "ThyMrMan".
      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates both the tag list and the OCI labels. The label that matters is
      # org.opencontainers.image.source — without it the GHCR package page is an
      # orphan that never links back to this repo or inherits its README.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          # Annotate the multi-arch manifest index too, not just the per-arch
          # children, so the package page reads correctly for a multi-platform build.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/${{ env.OWNER }}/commissary
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.version_tag }},enable=${{ inputs.version_tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
